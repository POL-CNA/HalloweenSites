<!DOCTYPE html>

<head>
    <title> Pumpkin Drawing</title>
    <link rel="stylesheet" href="drawstyle.css">

</head>

<body>
    <h1> Pumpkin</h1>
    
    <div class="stem"></div>
    <div class="orangebody"></div>
    <div class="eye1"></div>
    <div class="eye2"></div>
    <div class="nose"></div>
    <div class="mouth"></div>

    <script>
        document.addEventListener("pointermove", (event) => {
            document.body.style.setProperty("--light-x", `${event.clientX}px`);
            document.body.style.setProperty("--light-y", `${event.clientY}px`);
        });
    </script>

</body>

</html>
