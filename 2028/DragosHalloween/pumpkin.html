<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Pumpkin Patch</title>
    <link rel="stylesheet" href="pumpkin.css">
</head>
<body>
    <main>
        <h1>Happy Halloween!</h1>

        <div class="pumpkin" role="img" aria-label="A jack-o'-lantern pumpkin">
            <div class="stem" aria-hidden="true"></div>
            <div class="leaf" aria-hidden="true"></div>
            <div class="body" aria-hidden="true"></div>
            <div class="eye1" aria-hidden="true"></div>
            <div class="eye2" aria-hidden="true"></div>
            <div class="nose" aria-hidden="true"></div>
            <div class="mouth" aria-hidden="true"></div>
        </div>

        <button onclick="window.location.href='index.html'">
            Back to last page
        </button>
    </main>
</body>
</html>
